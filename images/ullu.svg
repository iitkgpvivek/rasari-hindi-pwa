<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="50%" stop-color="#312e81"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Moon & Stars -->
    <circle cx="175" cy="55" r="18" fill="#fef08a"/>
    <circle cx="180" cy="52" r="14" fill="#312e81"/>
    <!-- Tree Branch Hollow -->
    <path d="M40 180 Q110 160 180 180 L180 220 L40 220 Z" fill="#78350f"/>
    <!-- Owl Body -->
    <ellipse cx="110" cy="155" rx="36" ry="44" fill="#a16207"/>
    <ellipse cx="110" cy="165" rx="24" ry="30" fill="#fef3c7"/>
    <!-- Wing Feathers -->
    <path d="M74 145 C68 165 78 185 88 180 Z" fill="#854d0e"/>
    <path d="M146 145 C152 165 142 185 132 180 Z" fill="#854d0e"/>
    <!-- Owl Big Golden Eyes -->
    <circle cx="92" cy="125" r="15" fill="#facc15" stroke="#713f12" stroke-width="2"/>
    <circle cx="92" cy="125" r="9" fill="#1e293b"/>
    <circle cx="89" cy="122" r="3.5" fill="#ffffff"/>
    <circle cx="128" cy="125" r="15" fill="#facc15" stroke="#713f12" stroke-width="2"/>
    <circle cx="128" cy="125" r="9" fill="#1e293b"/>
    <circle cx="125" cy="122" r="3.5" fill="#ffffff"/>
    <!-- Little Beak -->
    <polygon points="106,132 114,132 110,140" fill="#f97316"/>
    <!-- Ear Tufts -->
    <polygon points="80,105 88,88 96,105" fill="#a16207"/>
    <polygon points="124,105 132,88 140,105" fill="#a16207"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>