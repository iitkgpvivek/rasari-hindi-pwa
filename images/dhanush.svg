<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="bowGoldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#facc15"/><stop offset="50%" stop-color="#d97706"/><stop offset="100%" stop-color="#92400e"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Quiver with Arrows on Left -->
    <rect x="52" y="125" width="22" height="75" rx="6" fill="#b45309" stroke="#78350f" stroke-width="2"/>
    <path d="M52 140 H74" stroke="#facc15" stroke-width="3"/>
    <line x1="56" y1="125" x2="56" y2="105" stroke="#78350f" stroke-width="3"/>
    <polygon points="56,105 52,112 60,112" fill="#ef4444"/>
    <line x1="68" y1="125" x2="68" y2="100" stroke="#78350f" stroke-width="3"/>
    <polygon points="68,100 64,107 72,107" fill="#3b82f6"/>
    <!-- Majestic Carved Bow Body -->
    <path d="M85 50 C145 75 145 165 85 190" stroke="url(#bowGoldG)" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M85 50 C140 75 140 165 85 190" stroke="#fef08a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Ornate Bow Tips & Grip -->
    <circle cx="85" cy="50" r="8" fill="#d97706"/>
    <circle cx="85" cy="190" r="8" fill="#d97706"/>
    <rect x="122" y="112" width="10" height="18" rx="3" fill="#dc2626"/>
    <!-- Taut Bowstring -->
    <line x1="85" y1="50" x2="85" y2="190" stroke="#f8fafc" stroke-width="3" opacity="0.9"/>
    <!-- Golden Arrow Drawn on Bow -->
    <line x1="72" y1="120" x2="160" y2="120" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="164,120 152,113 155,120 152,127" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <polygon points="76,120 68,112 78,112" fill="#f43f5e"/>
    <polygon points="76,120 68,128 78,128" fill="#f43f5e"/>
    <!-- Sparkles -->
    <polygon points="160,105 162,110 167,112 162,114 160,119 158,114 153,112 158,110" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>