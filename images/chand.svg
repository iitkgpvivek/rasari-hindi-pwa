<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#312e81"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#1e1b4b" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Stars in Night Sky -->
    <circle cx="50" cy="65" r="2.5" fill="#ffffff"/>
    <circle cx="165" cy="55" r="3" fill="#fef08a"/>
    <circle cx="175" cy="115" r="2" fill="#ffffff"/>
    <circle cx="45" cy="125" r="2.5" fill="#fde047"/>
    <!-- Golden Crescent Moon Body -->
    <path d="M125 55 C165 85 160 145 110 165 C145 145 145 85 110 65 Z" fill="#facc15" stroke="#eab308" stroke-width="2"/>
    <circle cx="118" cy="105" r="45" fill="#fef08a" opacity="0.3"/>
    <!-- Sleeping Eyes on Moon -->
    <path d="M126 102 Q132 108 138 102" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="132" cy="112" rx="4" ry="2" fill="#f43f5e" opacity="0.5"/>
    <!-- Night Cap on Moon -->
    <path d="M112 62 Q125 40 100 35" stroke="#3b82f6" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="35" r="5" fill="#ffffff"/>
    <!-- Fluffy Pillow Cloud below Moon -->
    <ellipse cx="110" cy="180" rx="55" ry="24" fill="#ffffff" opacity="0.9"/>
    <circle cx="80" cy="168" r="22" fill="#ffffff"/>
    <circle cx="140" cy="168" r="22" fill="#ffffff"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>