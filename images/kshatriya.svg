<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="armorGoldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Golden Breastplate & Royal Red Cape -->
    <path d="M62 210 C55 170 85 145 110 145 C135 145 165 170 158 210 Z" fill="#dc2626"/>
    <path d="M78 150 L142 150 L134 205 L86 205 Z" fill="url(#armorGoldG)" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="110" cy="175" r="8" fill="#ea580c"/>
    <!-- Brave Head & Face -->
    <circle cx="110" cy="115" r="28" fill="#fed7aa"/>
    <!-- Golden Helmet (Mukut / Crown) with Red Plume -->
    <path d="M82 108 C82 85 138 85 138 108 Z" fill="url(#armorGoldG)"/>
    <polygon points="110,65 116,85 104,85" fill="#facc15"/>
    <path d="M110 65 Q118 45 110 40 Q102 45 110 65 Z" fill="#ef4444"/>
    <!-- Red Tilak on Forehead -->
    <path d="M107 100 H113 V106 Q110 110 107 106 Z" fill="#dc2626"/>
    <!-- Brave Friendly Eyes -->
    <ellipse cx="98" cy="115" rx="4" ry="5.5" fill="#1e293b"/>
    <circle cx="96.5" cy="113.5" r="1.8" fill="#ffffff"/>
    <ellipse cx="122" cy="115" rx="4" ry="5.5" fill="#1e293b"/>
    <circle cx="120.5" cy="113.5" r="1.8" fill="#ffffff"/>
    <!-- Smile of Confidence -->
    <path d="M105 125 Q110 130 115 125" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Sturdy Royal Shield on Left -->
    <ellipse cx="68" cy="175" rx="22" ry="32" fill="#3b82f6" stroke="#facc15" stroke-width="4"/>
    <circle cx="68" cy="175" r="8" fill="#facc15"/>
    <!-- Gleaming Sword Raised in Right Hand -->
    <line x1="145" y1="175" x2="175" y2="105" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>
    <line x1="138" y1="168" x2="152" y2="162" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="140" cy="178" r="4" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>