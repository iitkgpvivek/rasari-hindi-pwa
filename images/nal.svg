<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="tapChromeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#cbd5e1"/><stop offset="70%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#082f49" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Wall Pipe Inset -->
    <rect x="40" y="80" width="35" height="20" rx="4" fill="#64748b"/>
    <!-- Chrome Tap Body & Spout -->
    <path d="M65 84 L110 84 Q125 84 125 100 L125 125 L108 125 L108 100 Q108 94 95 94 L65 94 Z" fill="url(#tapChromeG)"/>
    <!-- Specular Highlight on Tap -->
    <path d="M68 87 L105 87" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Tap Valve & Red Star Knob -->
    <rect x="88" y="65" width="12" height="18" fill="#94a3b8"/>
    <path d="M80 62 H108" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
    <circle cx="94" cy="62" r="5" fill="#facc15"/>
    <!-- Bucket at Base -->
    <path d="M88 170 L142 170 L136 210 L94 210 Z" fill="#3b82f6"/>
    <ellipse cx="115" cy="170" rx="27" ry="6" fill="#60a5fa"/>
    <ellipse cx="115" cy="170" rx="23" ry="4.5" fill="#bae6fd"/>
    <!-- Flowing Crystal Clear Water Stream -->
    <path d="M112 125 Q115 145 114 170" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M114 125 Q116 145 115 170" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Water Splashes and Droplets -->
    <circle cx="102" cy="165" r="3" fill="#38bdf8"/>
    <circle cx="128" cy="162" r="2.5" fill="#38bdf8"/>
    <circle cx="114" cy="150" r="2" fill="#ffffff"/>
    <circle cx="106" cy="140" r="2.5" fill="#bae6fd"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>