<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="maneG" cx="45%" cy="40%" r="65%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="60%" stop-color="#d97706"/><stop offset="100%" stop-color="#b45309"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="60" ry="14" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Fluffy Golden Mane (Outer Circle) -->
    <circle cx="110" cy="120" r="52" fill="url(#maneG)"/>
    <!-- Lion Ears -->
    <circle cx="75" cy="78" r="14" fill="#d97706"/>
    <circle cx="75" cy="78" r="8" fill="#fef3c7"/>
    <circle cx="145" cy="78" r="14" fill="#d97706"/>
    <circle cx="145" cy="78" r="8" fill="#fef3c7"/>
    <!-- Lion Head -->
    <circle cx="110" cy="122" r="36" fill="#fde047"/>
    <!-- Golden Crown -->
    <polygon points="92,76 100,60 110,72 120,60 128,76" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="100" cy="60" r="2.5" fill="#ef4444"/>
    <circle cx="110" cy="72" r="2" fill="#3b82f6"/>
    <circle cx="120" cy="60" r="2.5" fill="#ef4444"/>
    <!-- Big Friendly Eyes -->
    <circle cx="96" cy="116" r="5.5" fill="#1e293b"/>
    <circle cx="94.5" cy="114" r="2.2" fill="#ffffff"/>
    <circle cx="124" cy="116" r="5.5" fill="#1e293b"/>
    <circle cx="122.5" cy="114" r="2.2" fill="#ffffff"/>
    <!-- Snout & Whiskers -->
    <ellipse cx="110" cy="132" rx="14" ry="10" fill="#fef9c3"/>
    <polygon points="105,126 115,126 110,132" fill="#78350f"/>
    <path d="M110 132 L110 138" stroke="#78350f" stroke-width="2"/>
    <path d="M104 138 Q110 144 116 138" stroke="#78350f" stroke-width="2" fill="none"/>
    <!-- Lion Body & Paws -->
    <path d="M85 165 C75 195 75 210 85 212 L135 212 C145 210 145 195 135 165 Z" fill="#fde047"/>
    <ellipse cx="90" cy="210" rx="10" ry="6" fill="#facc15"/>
    <ellipse cx="130" cy="210" rx="10" ry="6" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>