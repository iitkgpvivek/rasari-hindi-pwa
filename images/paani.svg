<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="dropBlueG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#0284c7"/><stop offset="100%" stop-color="#1d4ed8"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#082f49" opacity="0.25" filter="url(#ambOcc)"/>
    <ellipse cx="110" cy="215" rx="60" ry="14" fill="#38bdf8" opacity="0.5"/>
    <ellipse cx="110" cy="215" rx="35" ry="7" fill="#ffffff" opacity="0.6"/>
    <!-- Giant Glowing Blue Water Droplet -->
    <path d="M110 65 C135 105 155 135 150 165 C145 195 125 205 110 205 C95 205 75 195 70 165 C65 135 85 105 110 65 Z" fill="url(#dropBlueG)" stroke="#38bdf8" stroke-width="2"/>
    <!-- Specular Highlight -->
    <path d="M92 110 C85 125 85 150 92 165" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75"/>
    <circle cx="95" cy="105" r="3.5" fill="#ffffff" opacity="0.8"/>
    <!-- Cute Eyes -->
    <circle cx="102" cy="148" r="4.5" fill="#1e293b"/>
    <circle cx="100.5" cy="146.5" r="1.8" fill="#ffffff"/>
    <circle cx="122" cy="148" r="4.5" fill="#1e293b"/>
    <circle cx="120.5" cy="146.5" r="1.8" fill="#ffffff"/>
    <!-- Cheerful Smile -->
    <path d="M106 158 Q112 164 118 158" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="96" cy="154" rx="3" ry="1.8" fill="#f43f5e" opacity="0.5"/>
    <ellipse cx="128" cy="154" rx="3" ry="1.8" fill="#f43f5e" opacity="0.5"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>