<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="60" ry="14" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Woven Fruit Basket -->
    <path d="M52 145 L62 205 C64 212 156 212 158 205 L168 145 Z" fill="#b45309"/>
    <!-- Wicker Weave Texture -->
    <g stroke="#78350f" stroke-width="2" opacity="0.6">
      <line x1="68" y1="150" x2="152" y2="150"/>
      <line x1="72" y1="170" x2="148" y2="170"/>
      <line x1="76" y1="190" x2="144" y2="190"/>
      <line x1="85" y1="145" x2="95" y2="210"/>
      <line x1="110" y1="145" x2="110" y2="210"/>
      <line x1="135" y1="145" x2="125" y2="210"/>
    </g>
    <!-- Basket Rim -->
    <ellipse cx="110" cy="145" rx="58" ry="14" fill="#d97706" stroke="#92400e" stroke-width="2.5"/>
    <!-- Fruits Inside: Golden Mango -->
    <path d="M85 105 C105 100 120 125 110 145 C95 150 75 140 75 125 C75 110 80 105 85 105 Z" fill="#facc15"/>
    <ellipse cx="90" cy="115" rx="4" ry="2" fill="#ffffff" opacity="0.6"/>
    <!-- Red Glossy Apple -->
    <circle cx="125" cy="120" r="18" fill="#ef4444"/>
    <path d="M125 102 Q128 95 132 98" stroke="#78350f" stroke-width="2.5" fill="none"/>
    <ellipse cx="122" cy="112" rx="4" ry="2.5" fill="#ffffff" opacity="0.6"/>
    <!-- Yellow Banana Bunch -->
    <path d="M60 115 Q90 115 105 145" stroke="#fde047" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M68 122 Q95 122 110 148" stroke="#facc15" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Purple Grapes -->
    <circle cx="145" cy="135" r="7.5" fill="#a855f7"/>
    <circle cx="155" cy="130" r="7.5" fill="#9333ea"/>
    <circle cx="150" cy="145" r="7.5" fill="#7e22ce"/>
    <circle cx="140" cy="145" r="7" fill="#6b21a8"/>
    <!-- Fresh Green Leaf -->
    <path d="M105 105 C118 92 135 98 135 110 C122 115 110 110 105 105 Z" fill="#22c55e"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>