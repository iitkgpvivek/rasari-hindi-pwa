<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e1b4b"/><stop offset="50%" stop-color="#312e81"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#291004"/>
      <stop offset="100%" stop-color="#0f0502"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#451a03" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#000000" opacity="0.4" filter="url(#ambOcc)"/>
    <!-- Crossed Fire Logs -->
    <g transform="rotate(-20 110 185)">
      <rect x="65" y="180" width="90" height="15" rx="4" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    </g>
    <g transform="rotate(20 110 185)">
      <rect x="65" y="180" width="90" height="15" rx="4" fill="#92400e" stroke="#451a03" stroke-width="2"/>
    </g>
    <!-- Radiant Campfire Flames -->
    <path d="M110 65 C130 95 155 120 148 165 C142 195 125 195 110 195 C95 195 78 195 72 165 C65 120 90 95 110 65 Z" fill="#ea580c"/>
    <path d="M110 85 C122 110 140 128 135 165 C130 188 120 190 110 190 C100 190 90 188 85 165 C80 128 98 110 110 85 Z" fill="#facc15"/>
    <path d="M110 115 C116 130 126 142 122 168 C120 182 114 185 110 185 C106 185 100 182 98 168 C94 142 104 130 110 115 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Leaping Embers -->
    <circle cx="135" cy="80" r="3" fill="#facc15"/>
    <circle cx="85" cy="90" r="2.5" fill="#facc15"/>
    <circle cx="110" cy="50" r="2" fill="#fef08a"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>