<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="70%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#7dd3fc"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="duckGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#eab308"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Water Ripples -->
    <ellipse cx="110" cy="210" rx="65" ry="16" fill="#0284c7" opacity="0.4" filter="url(#ambOcc)"/>
    <ellipse cx="110" cy="208" rx="55" ry="10" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.6"/>
    <!-- Duck Body -->
    <ellipse cx="105" cy="162" rx="42" ry="28" fill="url(#duckGrad)"/>
    <path d="M138 152 Q156 142 152 165 Q140 168 135 160 Z" fill="#f59e0b"/>
    <!-- Wing -->
    <path d="M85 158 C85 145 105 145 118 152 C108 172 90 172 85 158 Z" fill="#eab308"/>
    <!-- Neck & Head -->
    <circle cx="82" cy="115" r="26" fill="url(#duckGrad)"/>
    <!-- Orange Beak -->
    <path d="M58 116 Q40 120 54 128 Q64 126 62 118 Z" fill="#f97316"/>
    <!-- Large Pixar Eye -->
    <circle cx="78" cy="110" r="7" fill="#1e293b"/>
    <circle cx="76" cy="108" r="2.8" fill="#ffffff"/>
    <circle cx="80" cy="113" r="1.2" fill="#ffffff"/>
    <!-- Rosy Cheek -->
    <ellipse cx="88" cy="122" rx="4" ry="2.5" fill="#f43f5e" opacity="0.45"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>