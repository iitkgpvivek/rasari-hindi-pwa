<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#22c55e" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Playful Raindrops -->
    <path d="M45 60 Q48 70 45 72 Q42 70 45 60 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M175 75 Q178 85 175 87 Q172 85 175 75 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M55 125 Q58 135 55 137 Q52 135 55 125 Z" fill="#ffffff" opacity="0.8"/>
    <path d="M165 140 Q168 150 165 152 Q162 150 165 140 Z" fill="#ffffff" opacity="0.8"/>
    <!-- Umbrella Shaft & Curved Handle -->
    <line x1="110" y1="65" x2="110" y2="185" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path d="M110 185 C110 205 85 205 85 188" stroke="#78350f" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Umbrella Canopy (Bright Segments) -->
    <path d="M42 135 C42 75 178 75 178 135 C158 128 140 128 124 135 C110 128 92 128 76 135 C60 128 48 128 42 135 Z" fill="#f43f5e"/>
    <!-- Colored Panels -->
    <path d="M72 135 C80 95 110 75 110 75 C110 75 60 95 42 135 Z" fill="#facc15"/>
    <path d="M148 135 C140 95 110 75 110 75 C110 75 160 95 178 135 Z" fill="#38bdf8"/>
    <path d="M110 75 C110 75 92 100 110 132 C128 100 110 75 110 75 Z" fill="#a855f7"/>
    <!-- Top Finial Tip -->
    <polygon points="107,75 113,75 110,62" fill="#ca8a04"/>
    <circle cx="110" cy="62" r="3.5" fill="#eab308"/>
    <!-- Rain Ripple on Ground -->
    <ellipse cx="110" cy="225" rx="35" ry="8" fill="#38bdf8" opacity="0.6"/>
    <ellipse cx="110" cy="225" rx="20" ry="4.5" fill="#ffffff" opacity="0.8"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>