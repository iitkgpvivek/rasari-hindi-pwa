<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#cffafe"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="60" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Fan of Shimmering Feathers (Tail) -->
    <ellipse cx="110" cy="115" rx="65" ry="55" fill="#15803d" opacity="0.85"/>
    <!-- Peacock Feather Eyes -->
    <g fill="#0284c7" stroke="#facc15" stroke-width="2">
      <ellipse cx="70" cy="90" rx="9" ry="12"/>
      <ellipse cx="95" cy="72" rx="9" ry="12"/>
      <ellipse cx="125" cy="72" rx="9" ry="12"/>
      <ellipse cx="150" cy="90" rx="9" ry="12"/>
      <ellipse cx="60" cy="120" rx="9" ry="12"/>
      <ellipse cx="160" cy="120" rx="9" ry="12"/>
    </g>
    <!-- Royal Blue Peacock Body -->
    <ellipse cx="110" cy="160" rx="26" ry="32" fill="#1d4ed8"/>
    <!-- Graceful Slender Blue Neck -->
    <path d="M110 160 Q110 110 110 95" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Head & Crest Plumes (Kalgi) -->
    <circle cx="110" cy="85" r="14" fill="#2563eb"/>
    <circle cx="113" cy="83" r="2.5" fill="#1e293b"/>
    <polygon points="120,83 134,87 120,91" fill="#facc15"/>
    <!-- Three Feather Crest Tips -->
    <line x1="106" y1="73" x2="100" y2="60" stroke="#1d4ed8" stroke-width="1.8"/>
    <circle cx="100" cy="60" r="3" fill="#22c55e"/>
    <line x1="110" y1="73" x2="110" y2="58" stroke="#1d4ed8" stroke-width="1.8"/>
    <circle cx="110" cy="58" r="3.5" fill="#22c55e"/>
    <line x1="114" y1="73" x2="120" y2="60" stroke="#1d4ed8" stroke-width="1.8"/>
    <circle cx="120" cy="60" r="3" fill="#22c55e"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>