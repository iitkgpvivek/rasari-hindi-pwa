<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="potRedG" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#f87171"/><stop offset="45%" stop-color="#ef4444"/><stop offset="85%" stop-color="#b91c1c"/><stop offset="100%" stop-color="#7f1d1d"/></radialGradient>
       <radialGradient id="lidGoldG" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#f97316" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="58" ry="12" fill="#7c2d12" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Pleasant Aroma Steam Swirls -->
    <path d="M95 70 Q85 50 100 35" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M125 65 Q135 45 120 30" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Cooking Pot Body (Glossy Red Handi) -->
    <path d="M62 135 C58 185 75 208 110 208 C145 208 162 185 158 135 Z" fill="url(#potRedG)"/>
    <!-- Pot Handles -->
    <path d="M52 145 C45 145 45 160 54 160" stroke="#991b1b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M168 145 C175 145 175 160 166 160" stroke="#991b1b" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Pot Rim -->
    <ellipse cx="110" cy="135" rx="48" ry="12" fill="#991b1b"/>
    <!-- Cute Eyes on Pot -->
    <circle cx="98" cy="165" r="4.5" fill="#ffffff"/>
    <circle cx="98" cy="165" r="2.5" fill="#1e293b"/>
    <circle cx="122" cy="165" r="4.5" fill="#ffffff"/>
    <circle cx="122" cy="165" r="2.5" fill="#1e293b"/>
    <path d="M106 175 Q110 180 114 175" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Cheerful Lifted Golden Lid (Dhakkan) -->
    <g transform="rotate(-14 110 110)">
      <ellipse cx="110" cy="115" rx="50" ry="14" fill="url(#lidGoldG)"/>
      <ellipse cx="110" cy="110" rx="38" ry="9" fill="#facc15"/>
      <!-- Lid Knob / Handle -->
      <rect x="106" y="90" width="8" height="16" rx="3" fill="#ca8a04"/>
      <circle cx="110" cy="88" r="8" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    </g>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>