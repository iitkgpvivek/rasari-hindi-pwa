<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <!-- Background Sky & Garden Gradients -->
    <linearGradient id="anaarSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#fef9c3" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grassHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="40%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <!-- 3D Pomegranate Volumetric Shading -->
    <radialGradient id="pomBody3D" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ff6b81"/>
      <stop offset="35%" stop-color="#e11d48"/>
      <stop offset="70%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </radialGradient>
    <radialGradient id="pomInside" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="70%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <radialGradient id="seedGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambientOcclusion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Full-bleed Sky Background -->
  <rect width="220" height="260" fill="url(#anaarSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Soft Hills -->
  <path d="M-20 185 Q40 160 110 175 Q180 190 240 170 L240 260 L-20 260 Z" fill="#bbf7d0" opacity="0.7"/>

  <!-- Foreground Lush Grassy Hill -->
  <path d="M-20 195 Q60 175 140 185 Q190 192 240 180 L240 260 L-20 260 Z" fill="url(#grassHill)"/>

  <!-- Cute Daisies on the Grass -->
  <circle cx="28" cy="225" r="4" fill="#ffffff"/>
  <circle cx="28" cy="225" r="1.8" fill="#facc15"/>
  <circle cx="195" cy="215" r="4.5" fill="#ffffff"/>
  <circle cx="195" cy="215" r="2" fill="#facc15"/>
  <circle cx="178" cy="235" r="3.5" fill="#ffffff"/>
  <circle cx="178" cy="235" r="1.5" fill="#facc15"/>

  <!-- Soft Ambient Occlusion Shadow Under Pomegranate -->
  <ellipse cx="108" cy="208" rx="60" ry="14" fill="#064e3b" opacity="0.32" filter="url(#ambientOcclusion)"/>

  <!-- Main 3D Pomegranate Group -->
  <g filter="url(#softShadow)">
    <!-- Glossy Leaf -->
    <path d="M125 75 C145 50 175 60 182 82 C160 92 135 88 125 75 Z" fill="url(#leafGrad)"/>
    <path d="M128 76 Q150 72 178 80" stroke="#bbf7d0" stroke-width="1.8" fill="none" opacity="0.6"/>
    <!-- Leaf Dewdrop -->
    <circle cx="158" cy="72" r="2.5" fill="#ffffff" opacity="0.85"/>

    <!-- Stem -->
    <path d="M112 85 Q118 70 128 74" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Pomegranate Calyx (Crown) -->
    <path d="M96 82 L102 65 L108 75 L114 62 L120 75 L126 65 L128 82 Z" fill="#9f1239"/>
    <path d="M102 67 L108 75 L114 64 L120 75 L124 67" stroke="#e11d48" stroke-width="1.5" fill="none"/>

    <!-- Big 3D Spherical Body -->
    <circle cx="108" cy="142" r="58" fill="url(#pomBody3D)"/>

    <!-- Specular Highlight Curve (3D Gloss) -->
    <path d="M72 108 C88 94 112 94 128 102" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.45"/>
    <circle cx="78" cy="118" r="3.5" fill="#ffffff" opacity="0.6"/>

    <!-- Cut-Open Wedge Window showing Ruby Seeds -->
    <path d="M108 142 L72 158 C78 185 105 198 135 190 C155 180 162 160 156 142 Z" fill="url(#pomInside)"/>
    <path d="M108 142 L72 158 C78 185 105 198 135 190 C155 180 162 160 156 142 Z" stroke="#be123c" stroke-width="3" fill="none"/>

    <!-- Ruby Seeds Cluster with 3D Gloss -->
    <g>
      <!-- Row 1 -->
      <circle cx="95" cy="155" r="6" fill="url(#seedGlow)"/>
      <circle cx="93" cy="153" r="1.8" fill="#ffffff" opacity="0.7"/>

      <circle cx="110" cy="152" r="6.5" fill="url(#seedGlow)"/>
      <circle cx="108" cy="150" r="2" fill="#ffffff" opacity="0.7"/>

      <circle cx="125" cy="152" r="6" fill="url(#seedGlow)"/>
      <circle cx="123" cy="150" r="1.8" fill="#ffffff" opacity="0.7"/>

      <circle cx="138" cy="155" r="5.5" fill="url(#seedGlow)"/>
      <circle cx="136" cy="153" r="1.6" fill="#ffffff" opacity="0.7"/>

      <!-- Row 2 -->
      <circle cx="86" cy="167" r="6" fill="url(#seedGlow)"/>
      <circle cx="84" cy="165" r="1.8" fill="#ffffff" opacity="0.7"/>

      <circle cx="101" cy="166" r="6.8" fill="url(#seedGlow)"/>
      <circle cx="99" cy="163" r="2" fill="#ffffff" opacity="0.7"/>

      <circle cx="118" cy="165" r="7" fill="url(#seedGlow)"/>
      <circle cx="116" cy="162" r="2.2" fill="#ffffff" opacity="0.7"/>

      <circle cx="134" cy="167" r="6" fill="url(#seedGlow)"/>
      <circle cx="132" cy="164" r="1.8" fill="#ffffff" opacity="0.7"/>

      <!-- Row 3 -->
      <circle cx="98" cy="179" r="6" fill="url(#seedGlow)"/>
      <circle cx="96" cy="177" r="1.8" fill="#ffffff" opacity="0.7"/>

      <circle cx="114" cy="179" r="6.5" fill="url(#seedGlow)"/>
      <circle cx="112" cy="177" r="2" fill="#ffffff" opacity="0.7"/>

      <circle cx="128" cy="178" r="5.5" fill="url(#seedGlow)"/>
      <circle cx="126" cy="176" r="1.6" fill="#ffffff" opacity="0.7"/>
    </g>

    <!-- Cute Smiling Storybook Character Face Option (Pixar Touch) -->
    <!-- Large, glossy, friendly eyes -->
    <ellipse cx="88" cy="126" rx="5" ry="6.5" fill="#1e293b"/>
    <circle cx="86.5" cy="124" r="2.2" fill="#ffffff"/>
    <circle cx="89.5" cy="128" r="1" fill="#ffffff"/>

    <ellipse cx="128" cy="124" rx="5" ry="6.5" fill="#1e293b"/>
    <circle cx="126.5" cy="122" r="2.2" fill="#ffffff"/>
    <circle cx="129.5" cy="126" r="1" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="80" cy="133" rx="5" ry="3" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="136" cy="131" rx="5" ry="3" fill="#fda4af" opacity="0.6"/>

    <!-- Happy Little Smile -->
    <path d="M104 129 Q108 133 112 129" stroke="#881337" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sparkles -->
  <path d="M42 90 L45 80 L48 90 L58 93 L48 96 L45 106 L42 96 L32 93 Z" fill="#fde047" opacity="0.8"/>
  <circle cx="180" cy="115" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="190" cy="95" r="1.5" fill="#ffffff" opacity="0.7"/>
</svg>
