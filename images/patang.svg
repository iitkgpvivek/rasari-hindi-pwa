<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
    <linearGradient id="kiteG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f43f5e"/><stop offset="100%" stop-color="#be123c"/></linearGradient>
    <linearGradient id="kiteG2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#facc15"/><stop offset="100%" stop-color="#eab308"/></linearGradient>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#86efac" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Cloud in background -->
    <path d="M30 110 C30 98 45 95 55 100 C62 92 80 92 86 102 C94 102 100 110 98 120 C95 128 35 128 30 110 Z" fill="#ffffff" opacity="0.8"/>
    <!-- Kite String -->
    <path d="M110 162 Q90 190 70 230" stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.85"/>
    <!-- Kite Diamond -->
    <polygon points="110,65 158,115 110,165 62,115" fill="url(#kiteG1)"/>
    <polygon points="110,65 158,115 110,115" fill="url(#kiteG2)"/>
    <polygon points="110,115 62,115 110,165" fill="url(#kiteG2)"/>
    <!-- Bamboo Spine & Bow -->
    <line x1="110" y1="65" x2="110" y2="165" stroke="#78350f" stroke-width="2"/>
    <path d="M62 115 Q110 92 158 115" stroke="#78350f" stroke-width="2" fill="none"/>
    <!-- Tail Ribbons -->
    <polygon points="110,165 98,185 122,185" fill="#facc15"/>
    <polygon points="110,185 102,198 118,198" fill="#ec4899"/>
    <!-- Cute Face on Kite -->
    <circle cx="100" cy="110" r="3.5" fill="#1e293b"/>
    <circle cx="120" cy="110" r="3.5" fill="#1e293b"/>
    <path d="M106 116 Q110 120 114 116" stroke="#991b1b" stroke-width="1.8" fill="none"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>