<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#fef9c3"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="grape3D" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#c084fc"/><stop offset="35%" stop-color="#9333ea"/><stop offset="75%" stop-color="#6b21a8"/><stop offset="100%" stop-color="#3b0764"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#86efac" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Vine & Tendril -->
    <path d="M110 50 Q120 70 120 85" stroke="#78350f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M110 65 C85 45 60 55 58 75 C85 80 102 75 110 65 Z" fill="#16a34a"/>
    <path d="M118 62 C145 45 170 55 172 75 C145 80 128 75 118 62 Z" fill="#22c55e"/>
    <!-- Grape Cluster with 3D Spherical Grapes -->
    <g>
      <!-- Row 1 -->
      <circle cx="92" cy="100" r="14" fill="url(#grape3D)"/>
      <circle cx="128" cy="100" r="14" fill="url(#grape3D)"/>
      <circle cx="110" cy="95" r="14" fill="url(#grape3D)"/>
      <!-- Row 2 -->
      <circle cx="82" cy="122" r="14" fill="url(#grape3D)"/>
      <circle cx="110" cy="120" r="14.5" fill="url(#grape3D)"/>
      <circle cx="138" cy="122" r="14" fill="url(#grape3D)"/>
      <!-- Row 3 -->
      <circle cx="96" cy="144" r="14" fill="url(#grape3D)"/>
      <circle cx="124" cy="144" r="14" fill="url(#grape3D)"/>
      <!-- Row 4 -->
      <circle cx="110" cy="166" r="13.5" fill="url(#grape3D)"/>
      <!-- Bottom tip -->
      <circle cx="110" cy="188" r="12" fill="url(#grape3D)"/>
    </g>
    <!-- Specular Glistening Dots -->
    <circle cx="106" cy="90" r="3" fill="#ffffff" opacity="0.65"/>
    <circle cx="88" cy="95" r="3" fill="#ffffff" opacity="0.65"/>
    <circle cx="106" cy="115" r="3" fill="#ffffff" opacity="0.65"/>
    <circle cx="92" cy="140" r="3" fill="#ffffff" opacity="0.65"/>
    <circle cx="106" cy="162" r="2.8" fill="#ffffff" opacity="0.65"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>