<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="chariotGoldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#ca8a04"/></linearGradient>
       <radialGradient id="woodWheelG" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#b45309"/><stop offset="70%" stop-color="#78350f"/><stop offset="100%" stop-color="#451a03"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="65" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Royal Chariot Canopy / Dome -->
    <path d="M52 105 C52 70 128 70 128 105 Z" fill="url(#chariotGoldG)"/>
    <!-- Chariot Flag Fluttering on Top -->
    <line x1="90" y1="52" x2="90" y2="85" stroke="#ca8a04" stroke-width="3"/>
    <polygon points="90,52 65,62 90,72" fill="#ea580c"/>
    <circle cx="90" cy="50" r="3" fill="#facc15"/>
    <!-- Canopy Support Pillars -->
    <rect x="58" y="105" width="5" height="45" fill="#ca8a04"/>
    <rect x="118" y="105" width="5" height="45" fill="#ca8a04"/>
    <!-- Royal Throne Seat & Body -->
    <path d="M48 135 L132 135 C142 135 146 145 142 165 L52 165 C44 165 42 145 48 135 Z" fill="url(#chariotGoldG)" stroke="#b45309" stroke-width="2"/>
    <rect x="54" y="142" width="22" height="18" rx="3" fill="#dc2626"/>
    <!-- Front Chariot Shaft connecting to Horses -->
    <line x1="135" y1="158" x2="195" y2="152" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <!-- Grand Ornate Spoked Wheel (Chariot Chakra) -->
    <circle cx="88" cy="172" r="32" fill="url(#woodWheelG)" stroke="#facc15" stroke-width="4"/>
    <circle cx="88" cy="172" r="26" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
    <circle cx="88" cy="172" r="7" fill="#facc15" stroke="#92400e" stroke-width="2"/>
    <!-- 8 Royal Wheel Spokes -->
    <g stroke="#facc15" stroke-width="3">
      <line x1="88" y1="140" x2="88" y2="204"/>
      <line x1="56" y1="172" x2="120" y2="172"/>
      <line x1="65" y1="149" x2="111" y2="195"/>
      <line x1="65" y1="195" x2="111" y2="149"/>
    </g>
    <!-- Wheel Hub Jewel -->
    <circle cx="88" cy="172" r="3" fill="#dc2626"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>