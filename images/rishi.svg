<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="saffronG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdba74"/><stop offset="50%" stop-color="#f97316"/><stop offset="100%" stop-color="#c2410c"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#4ade80" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Golden Halo / Aura -->
    <circle cx="110" cy="115" r="46" fill="#fef08a" opacity="0.6"/>
    <circle cx="110" cy="115" r="38" fill="#fef9c3" opacity="0.8"/>
    <!-- Lotus Meditation Mat -->
    <ellipse cx="110" cy="208" rx="60" ry="16" fill="#f472b6" opacity="0.85"/>
    <ellipse cx="110" cy="206" rx="48" ry="12" fill="#fb7185"/>
    <!-- Saffron Robe Body -->
    <path d="M72 170 C72 140 148 140 148 170 L160 205 L60 205 Z" fill="url(#saffronG)"/>
    <path d="M85 160 L110 195 L135 160 Z" fill="#ea580c" opacity="0.5"/>
    <!-- Rudraksha Mala -->
    <path d="M96 150 Q110 178 124 150" stroke="#78350f" stroke-width="3" stroke-dasharray="2 3" fill="none"/>
    <circle cx="110" cy="165" r="3" fill="#ea580c"/>
    <!-- Serene Head -->
    <circle cx="110" cy="118" r="28" fill="#fed7aa"/>
    <!-- Topknot Bun (Juda) with Flower -->
    <ellipse cx="110" cy="85" rx="14" ry="12" fill="#451a03"/>
    <circle cx="110" cy="74" r="5" fill="#ea580c"/>
    <!-- Tilak on Forehead -->
    <path d="M107 100 H113 V108 Q110 114 107 108 Z" fill="#dc2626"/>
    <line x1="104" y1="102" x2="116" y2="102" stroke="#facc15" stroke-width="1.5"/>
    <!-- Peaceful Closed Eyes -->
    <path d="M96 118 Q102 124 106 118" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M114 118 Q118 124 124 118" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Rosy Cheeks & Gentle Smile -->
    <ellipse cx="94" cy="125" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="126" cy="125" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <path d="M106 128 Q110 132 114 128" stroke="#9a3412" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Meditating Hands in Dhyana Mudra -->
    <ellipse cx="110" cy="188" rx="14" ry="7" fill="#fed7aa"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>