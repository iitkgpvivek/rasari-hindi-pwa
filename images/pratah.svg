<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fb923c"/><stop offset="35%" stop-color="#fde047"/><stop offset="70%" stop-color="#fef08a"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="sunPratah" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#fef08a"/><stop offset="70%" stop-color="#facc15"/><stop offset="100%" stop-color="#f97316"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Distant Mountain Ranges -->
    <polygon points="-20,180 50,110 120,180" fill="#6366f1" opacity="0.5"/>
    <polygon points="60,180 140,95 220,180" fill="#4f46e5" opacity="0.4"/>
    <polygon points="120,180 180,120 240,180" fill="#4338ca" opacity="0.5"/>
    <!-- Radiant Rising Sun -->
    <circle cx="110" cy="115" r="38" fill="url(#sunPratah)"/>
    <!-- Sunbeams -->
    <g stroke="#facc15" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="110" y1="65" x2="110" y2="52"/>
      <line x1="145" y1="80" x2="155" y2="70"/>
      <line x1="160" y1="115" x2="173" y2="115"/>
      <line x1="145" y1="150" x2="155" y2="160"/>
      <line x1="75" y1="80" x2="65" y2="70"/>
      <line x1="60" y1="115" x2="47" y2="115"/>
      <line x1="75" y1="150" x2="65" y2="160"/>
    </g>
    <!-- Smiling Face on Sun -->
    <circle cx="98" cy="112" r="3.5" fill="#b45309"/>
    <circle cx="122" cy="112" r="3.5" fill="#b45309"/>
    <path d="M104 122 Q110 128 116 122" stroke="#b45309" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Flying Morning Birds -->
    <path d="M60 70 Q66 62 72 70 Q78 62 84 70" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M140 60 Q145 54 150 60 Q155 54 160 60" stroke="#1e293b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Winding Golden River in Foreground -->
    <path d="M110 185 Q130 205 90 230 Q80 245 100 260 L140 260 Q120 245 130 230 Q160 205 110 185 Z" fill="#38bdf8"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>