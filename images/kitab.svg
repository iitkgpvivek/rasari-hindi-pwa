<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="60%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#fde047" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="208" rx="60" ry="12" fill="#713f12" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Book Cover -->
    <path d="M45 158 C70 148 105 155 110 162 C115 155 150 148 175 158 L170 178 C145 168 115 174 110 180 C105 174 75 168 50 178 Z" fill="#9333ea"/>
    <!-- Book Pages Curved -->
    <path d="M48 152 C72 138 105 145 110 152 L110 172 C105 165 72 158 48 172 Z" fill="#fffbeb"/>
    <path d="M172 152 C148 138 115 145 110 152 L110 172 C115 165 148 158 172 172 Z" fill="#fef3c7"/>
    <!-- Page text lines -->
    <line x1="60" y1="150" x2="98" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="60" y1="158" x2="94" y2="158" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="122" y1="150" x2="160" y2="150" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <line x1="126" y1="158" x2="160" y2="158" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <!-- Magical Sparkles & Bookmark ribbon -->
    <path d="M110 152 Q115 185 125 195" stroke="#ef4444" stroke-width="3" fill="none"/>
    <polygon points="110,85 114,105 134,109 114,113 110,133 106,113 86,109 106,105" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>