<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="60%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="carRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f87171"/><stop offset="35%" stop-color="#ef4444"/><stop offset="100%" stop-color="#991b1b"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#64748b" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Car Shadow -->
    <ellipse cx="110" cy="208" rx="65" ry="12" fill="#0f172a" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Red Car Cabin -->
    <path d="M72 135 Q90 92 130 92 Q155 92 165 135 Z" fill="#ef4444"/>
    <!-- Windows -->
    <path d="M78 132 Q92 98 126 98 L126 132 Z" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <path d="M130 98 Q152 98 158 132 L130 132 Z" fill="#e0f2fe" stroke="#334155" stroke-width="2"/>
    <!-- Car Body -->
    <rect x="45" y="132" width="138" height="42" rx="12" fill="url(#carRed)"/>
    <!-- Headlight & Grille -->
    <circle cx="48" cy="148" r="7" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>
    <rect x="176" y="146" width="6" height="10" rx="2" fill="#ef4444"/>
    <!-- Big 3D Wheels -->
    <circle cx="80" cy="178" r="18" fill="#1e293b"/>
    <circle cx="80" cy="178" r="9" fill="#94a3b8"/>
    <circle cx="80" cy="178" r="4" fill="#f1f5f9"/>
    <circle cx="150" cy="178" r="18" fill="#1e293b"/>
    <circle cx="150" cy="178" r="9" fill="#94a3b8"/>
    <circle cx="150" cy="178" r="4" fill="#f1f5f9"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>