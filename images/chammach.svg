<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="metalG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#e2e8f0"/><stop offset="70%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#94a3b8"/></linearGradient>
       <radialGradient id="metalBowlG" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#f8fafc"/><stop offset="60%" stop-color="#cbd5e1"/><stop offset="100%" stop-color="#64748b"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#86efac" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="58" ry="12" fill="#064e3b" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Spoon Handle -->
    <path d="M72 195 C68 185 92 140 102 110 L118 110 C108 140 88 185 84 195 Z" fill="url(#metalG)" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="78" cy="195" r="9" fill="url(#metalG)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Spoon Bowl (Shiny Metallic Ellipse) -->
    <ellipse cx="126" cy="95" rx="34" ry="46" fill="url(#metalG)" stroke="#94a3b8" stroke-width="3" transform="rotate(15 126 95)"/>
    <ellipse cx="126" cy="95" rx="26" ry="38" fill="url(#metalBowlG)" transform="rotate(15 126 95)"/>
    <!-- Specular Highlight -->
    <path d="M112 70 Q125 60 140 68" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>
    <!-- Ripe Red Strawberry resting in Spoon -->
    <path d="M124 82 C140 82 148 100 138 116 C128 132 112 128 110 114 C108 98 114 82 124 82 Z" fill="#ef4444"/>
    <circle cx="120" cy="92" r="1.2" fill="#fef08a"/>
    <circle cx="128" cy="96" r="1.2" fill="#fef08a"/>
    <circle cx="124" cy="106" r="1.2" fill="#fef08a"/>
    <!-- Strawberry Leaves -->
    <polygon points="124,78 118,74 126,72 134,74 128,78" fill="#22c55e"/>
    <!-- Droplet of Sweet Honey -->
    <path d="M142 110 Q148 126 142 128 Q136 126 142 110 Z" fill="#f59e0b"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>