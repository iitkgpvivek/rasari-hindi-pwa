<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="50%" stop-color="#fdf4ff"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffedd5"/><stop offset="50%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#fdba74"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#f472b6" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="112" cy="216" rx="58" ry="12" fill="#831843" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Cute Ankle & Foot Body -->
    <path d="M78 60 L78 145 C78 185 86 205 110 208 L152 208 C172 208 178 196 178 184 C178 176 166 172 154 172 L124 172 C108 172 104 150 104 120 L104 60 Z" fill="url(#skinG)" stroke="#fdba74" stroke-width="3"/>
    <!-- Rosy Glowing Heel Zone -->
    <ellipse cx="94" cy="192" rx="18" ry="14" fill="#fb7185" opacity="0.6" filter="url(#ambOcc)"/>
    <circle cx="92" cy="190" r="10" fill="#f43f5e" opacity="0.45"/>
    <circle cx="89" cy="187" r="4" fill="#ffffff" opacity="0.6"/>
    <!-- Payal (Anklet with Golden Ghungroos) -->
    <path d="M76 138 Q90 148 106 138" stroke="#facc15" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="80" cy="143" r="3" fill="#ea580c"/>
    <circle cx="91" cy="146" r="3" fill="#ea580c"/>
    <circle cx="102" cy="143" r="3" fill="#ea580c"/>
    <!-- Cute Toes indication -->
    <circle cx="168" cy="188" r="6" fill="#fed7aa" stroke="#fdba74" stroke-width="1.5"/>
    <circle cx="158" cy="186" r="5" fill="#fed7aa" stroke="#fdba74" stroke-width="1.5"/>
    <!-- Sparkles on Heel -->
    <polygon points="92,168 94,174 100,176 94,178 92,184 90,178 84,176 90,174" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>