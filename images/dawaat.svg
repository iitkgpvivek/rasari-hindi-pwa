<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#dbeafe"/><stop offset="50%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="inkpotGlassG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/><stop offset="50%" stop-color="#bae6fd" stop-opacity="0.4"/><stop offset="100%" stop-color="#60a5fa" stop-opacity="0.7"/></linearGradient>
       <radialGradient id="blueInkG" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="50%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#1e3a8a"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#1e3a8a" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#0f172a" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Feather Quill Pen Resting Inside -->
    <path d="M145 45 C155 85 130 135 110 160" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Feather Vanes (Majestic Peacock / Royal Blue Feather) -->
    <path d="M145 45 C175 60 165 95 135 115 C130 100 138 75 145 45 Z" fill="#0284c7"/>
    <path d="M145 45 C130 65 125 95 132 115" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
    <!-- Ornate Faceted Inkpot Glass Body -->
    <path d="M68 140 L76 200 C76 205 144 205 144 200 L152 140 Z" fill="url(#inkpotGlassG)" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Deep Royal Blue Ink Fluid Inside -->
    <path d="M72 155 L78 198 C78 202 142 202 142 198 L148 155 Z" fill="url(#blueInkG)"/>
    <ellipse cx="110" cy="155" rx="36" ry="7" fill="#1d4ed8"/>
    <!-- Golden Neck & Rim of Inkpot -->
    <rect x="92" y="130" width="36" height="12" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1.5"/>
    <ellipse cx="110" cy="130" rx="18" ry="4" fill="#fef08a"/>
    <!-- Ink Droplet & Specular Glint -->
    <circle cx="95" cy="165" r="4" fill="#ffffff" opacity="0.5"/>
    <ellipse cx="88" cy="175" rx="4" ry="12" fill="#ffffff" opacity="0.35" transform="rotate(-15 88 175)"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>