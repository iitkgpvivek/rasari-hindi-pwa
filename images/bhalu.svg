<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="bearGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#b45309"/><stop offset="60%" stop-color="#92400e"/><stop offset="100%" stop-color="#78350f"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#86efac" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="214" rx="55" ry="13" fill="#064e3b" opacity="0.32" filter="url(#ambOcc)"/>
    <!-- Ears -->
    <circle cx="72" cy="85" r="14" fill="#78350f"/>
    <circle cx="72" cy="85" r="8" fill="#fed7aa"/>
    <circle cx="148" cy="85" r="14" fill="#78350f"/>
    <circle cx="148" cy="85" r="8" fill="#fed7aa"/>
    <!-- Body -->
    <ellipse cx="110" cy="165" rx="48" ry="42" fill="url(#bearGrad)"/>
    <!-- Belly -->
    <ellipse cx="110" cy="172" rx="30" ry="26" fill="#fed7aa" opacity="0.65"/>
    <!-- Head -->
    <circle cx="110" cy="118" r="38" fill="url(#bearGrad)"/>
    <!-- Snout -->
    <ellipse cx="110" cy="130" rx="18" ry="14" fill="#ffedd5"/>
    <ellipse cx="110" cy="123" rx="7" ry="5" fill="#1e293b"/>
    <path d="M106 132 Q110 137 114 132" stroke="#78350f" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <!-- Eyes -->
    <circle cx="94" cy="112" r="5" fill="#1e293b"/>
    <circle cx="92.5" cy="110" r="2" fill="#ffffff"/>
    <circle cx="126" cy="112" r="5" fill="#1e293b"/>
    <circle cx="124.5" cy="110" r="2" fill="#ffffff"/>
    <!-- Cheeks -->
    <ellipse cx="84" cy="124" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="136" cy="124" rx="4" ry="2.5" fill="#f43f5e" opacity="0.4"/>
    <!-- Honey Pot in Paws -->
    <ellipse cx="110" cy="180" rx="16" ry="12" fill="#d97706"/>
    <ellipse cx="110" cy="172" rx="14" ry="4" fill="#f59e0b"/>
    <ellipse cx="110" cy="172" rx="10" ry="2.5" fill="#fef08a"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>