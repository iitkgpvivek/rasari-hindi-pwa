<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#6366f1" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#312e81" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- 3D Hexagon Facets (6 Vibrant Triangles Meeting at Center) -->
    <!-- Center Point: (110, 130), Radius: 55 -->
    <!-- Points: 0 deg: (165, 130), 60 deg: (137, 178), 120 deg: (83, 178), 180 deg: (55, 130), 240 deg: (83, 82), 300 deg: (137, 82) -->
    <polygon points="110,130 137,82 165,130" fill="#f43f5e" stroke="#ffffff" stroke-width="2"/>
    <polygon points="110,130 165,130 137,178" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <polygon points="110,130 137,178 83,178" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <polygon points="110,130 83,178 55,130" fill="#06b6d4" stroke="#ffffff" stroke-width="2"/>
    <polygon points="110,130 55,130 83,82" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
    <polygon points="110,130 83,82 137,82" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
    <!-- Outer Hexagon Golden Border -->
    <polygon points="137,82 165,130 137,178 83,178 55,130 83,82" fill="none" stroke="#facc15" stroke-width="5"/>
    <!-- Center Jewel Star -->
    <circle cx="110" cy="130" r="8" fill="#ffffff" stroke="#facc15" stroke-width="2"/>
    <!-- Jewel Sparkles -->
    <polygon points="110,65 113,72 120,75 113,78 110,85 107,78 100,75 107,72" fill="#ffffff"/>
    <polygon points="168,115 170,119 174,120 170,122 168,126 166,122 162,120 166,119" fill="#fef08a"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>