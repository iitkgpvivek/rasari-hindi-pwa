<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#291004"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="ploughWoodG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#b45309"/><stop offset="50%" stop-color="#92400e"/><stop offset="100%" stop-color="#78350f"/></linearGradient>
       <linearGradient id="bladeIronG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#475569"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#78350f" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Fresh Furrowed Soil Mounds -->
    <ellipse cx="110" cy="216" rx="70" ry="14" fill="#451a03" opacity="0.4" filter="url(#ambOcc)"/>
    <path d="M30 215 Q70 205 110 215 Q150 205 190 215" stroke="#78350f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Long Wooden Beam (Halis) -->
    <line x1="45" y1="95" x2="145" y2="190" stroke="url(#ploughWoodG)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="45" cy="95" r="7" fill="#ca8a04"/>
    <!-- Upright Wooden Handle (Muthiya) -->
    <path d="M125 75 C125 100 135 155 145 190" stroke="url(#ploughWoodG)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <rect x="118" y="70" width="14" height="8" rx="3" fill="#ca8a04"/>
    <!-- Sharp Iron Share (Kusa / Blade Furrowing Ground) -->
    <polygon points="140,180 182,198 135,212 125,190" fill="url(#bladeIronG)" stroke="#334155" stroke-width="1.5"/>
    <!-- Iron Rivets & Binding Straps -->
    <circle cx="140" cy="190" r="3" fill="#facc15"/>
    <rect x="130" y="172" width="12" height="6" fill="#334155"/>
    <!-- Fresh Soil Droplets Flying -->
    <circle cx="160" cy="202" r="3" fill="#92400e"/>
    <circle cx="170" cy="206" r="2.5" fill="#78350f"/>
    <!-- Sprouting Green Crop Seedling nearby -->
    <path d="M65 208 Q60 195 50 198 Q60 205 65 208 Z" fill="#22c55e"/>
    <path d="M65 208 Q70 195 80 198 Q70 205 65 208 Z" fill="#4ade80"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>