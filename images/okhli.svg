<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fef3c7"/><stop offset="50%" stop-color="#ffedd5"/><stop offset="100%" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="woodG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#92400e"/><stop offset="35%" stop-color="#b45309"/><stop offset="70%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/></linearGradient>
       <linearGradient id="pestleG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#78350f"/><stop offset="50%" stop-color="#d97706"/><stop offset="100%" stop-color="#451a03"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#b45309" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="14" fill="#451a03" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Mortar Base & Waist -->
    <path d="M68 120 C64 165 72 205 110 205 C148 205 156 165 152 120 Z" fill="url(#woodG)"/>
    <!-- Carved Brass Band on Mortar -->
    <path d="M72 155 Q110 168 148 155" stroke="#facc15" stroke-width="5" fill="none"/>
    <circle cx="110" cy="162" r="3.5" fill="#ca8a04"/>
    <!-- Mortar Top Rim -->
    <ellipse cx="110" cy="120" rx="44" ry="14" fill="#a16207"/>
    <ellipse cx="110" cy="120" rx="36" ry="10" fill="#451a03"/>
    <!-- Turmeric & Spice Mound Inside -->
    <ellipse cx="110" cy="122" rx="30" ry="7" fill="#facc15"/>
    <ellipse cx="110" cy="122" rx="20" ry="4" fill="#f59e0b"/>
    <!-- Pestle (Musal) at Angle -->
    <g transform="rotate(22 110 100)">
      <rect x="102" y="45" width="16" height="85" rx="7" fill="url(#pestleG)"/>
      <ellipse cx="110" cy="48" rx="8" ry="4" fill="#fde68a"/>
    </g>
    <!-- Sparkles -->
    <polygon points="145,95 147,100 152,102 147,104 145,109 143,104 138,102 143,100" fill="#f59e0b"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>