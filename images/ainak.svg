<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cffafe"/><stop offset="50%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#fef3c7"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="lensG" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.7"/><stop offset="100%" stop-color="#bae6fd" stop-opacity="0.85"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="205" rx="65" ry="14" fill="#0c4a6e" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Book Pedestal -->
    <rect x="42" y="180" width="136" height="26" rx="6" fill="#f43f5e"/>
    <rect x="46" y="182" width="128" height="6" fill="#ffffff" opacity="0.8"/>
    <!-- Spectacle Temples (Arms) -->
    <path d="M42 125 Q52 100 68 118" stroke="#ca8a04" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M178 125 Q168 100 152 118" stroke="#ca8a04" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Bridge -->
    <path d="M96 132 Q110 120 124 132" stroke="#eab308" stroke-width="6.5" fill="none" stroke-linecap="round"/>
    <!-- Left Rim & 3D Glass Lens -->
    <circle cx="76" cy="138" r="32" fill="url(#lensG)" stroke="#eab308" stroke-width="6.5"/>
    <circle cx="76" cy="138" r="27" fill="none" stroke="#fef08a" stroke-width="2"/>
    <!-- Left Glint Reflection -->
    <path d="M60 122 Q72 112 88 116" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="64" cy="148" r="3" fill="#ffffff" opacity="0.8"/>
    <!-- Right Rim & 3D Glass Lens -->
    <circle cx="144" cy="138" r="32" fill="url(#lensG)" stroke="#eab308" stroke-width="6.5"/>
    <circle cx="144" cy="138" r="27" fill="none" stroke="#fef08a" stroke-width="2"/>
    <!-- Right Glint Reflection -->
    <path d="M128 122 Q140 112 156 116" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.85"/>
    <circle cx="132" cy="148" r="3" fill="#ffffff" opacity="0.8"/>
    <!-- Friendly Cute Eyes Behind Lenses -->
    <ellipse cx="76" cy="140" rx="6" ry="8" fill="#1e293b"/>
    <circle cx="74" cy="137" r="2.5" fill="#ffffff"/>
    <ellipse cx="144" cy="140" rx="6" ry="8" fill="#1e293b"/>
    <circle cx="142" cy="137" r="2.5" fill="#ffffff"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>