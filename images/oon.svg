<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="60%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="yarnGrad" cx="35%" cy="30%" r="70%"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="35%" stop-color="#f472b6"/><stop offset="75%" stop-color="#db2777"/><stop offset="100%" stop-color="#9d174d"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#fde047" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="208" rx="52" ry="12" fill="#713f12" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Knitting Needles Crossing -->
    <line x1="55" y1="75" x2="165" y2="185" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="55" cy="75" r="6" fill="#f43f5e"/>
    <line x1="165" y1="75" x2="55" y2="185" stroke="#94a3b8" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="165" cy="75" r="6" fill="#f43f5e"/>
    <!-- Yarn Ball -->
    <circle cx="110" cy="142" r="48" fill="url(#yarnGrad)"/>
    <!-- Yarn Texture Swirls -->
    <path d="M80 120 Q110 100 140 120" stroke="#f472b6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M72 142 Q110 128 148 142" stroke="#f472b6" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M82 165 Q110 152 138 165" stroke="#f472b6" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Loose Thread Wandering -->
    <path d="M142 160 Q175 170 168 200 Q150 205 130 195" stroke="#db2777" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>