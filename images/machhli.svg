<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="40%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="fishGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#fef08a"/><stop offset="35%" stop-color="#fb923c"/><stop offset="75%" stop-color="#f97316"/><stop offset="100%" stop-color="#ea580c"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Water Bubbles -->
    <circle cx="48" cy="80" r="5" fill="#ffffff" opacity="0.4"/>
    <circle cx="56" cy="62" r="3.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="42" cy="120" r="6" fill="#ffffff" opacity="0.3"/>
    <!-- Tail Fin -->
    <path d="M152 140 Q188 108 185 140 Q188 172 152 140 Z" fill="#f97316"/>
    <!-- Dorsal Fin -->
    <path d="M96 108 Q120 85 138 112 Z" fill="#fb923c"/>
    <!-- 3D Fish Body -->
    <ellipse cx="108" cy="140" rx="46" ry="30" fill="url(#fishGrad)"/>
    <!-- Scales highlight -->
    <path d="M102 124 Q95 140 102 156" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.5"/>
    <path d="M120 126 Q113 140 120 154" stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.5"/>
    <!-- Side Fin -->
    <path d="M100 142 C90 155 98 168 114 158 Z" fill="#ea580c"/>
    <!-- Big Pixar Fish Eye -->
    <circle cx="76" cy="132" r="9" fill="#ffffff"/>
    <circle cx="74" cy="132" r="6" fill="#1e293b"/>
    <circle cx="72" cy="130" r="2.5" fill="#ffffff"/>
    <!-- Happy Fish Lips -->
    <path d="M62 142 Q54 140 60 146" stroke="#c2410c" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="85" cy="144" rx="4" ry="2.5" fill="#f43f5e" opacity="0.5"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>