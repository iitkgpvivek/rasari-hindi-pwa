<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#d97706" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <ellipse cx="110" cy="216" rx="60" ry="12" fill="#78350f" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Camel Body with Hump -->
    <ellipse cx="110" cy="165" rx="42" ry="30" fill="#d97706"/>
    <circle cx="110" cy="130" r="22" fill="#d97706"/>
    <!-- Legs -->
    <rect x="80" y="185" width="10" height="28" rx="5" fill="#b45309"/>
    <rect x="130" y="185" width="10" height="28" rx="5" fill="#b45309"/>
    <!-- Long Curved Neck & Head -->
    <path d="M125 160 C155 130 145 95 145 75" stroke="#d97706" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="145" cy="72" r="15" fill="#d97706"/>
    <circle cx="144" cy="70" r="3" fill="#1e293b"/>
    <circle cx="143" cy="69" r="1" fill="#ffffff"/>
    <ellipse cx="152" cy="78" rx="8" ry="5" fill="#b45309"/>
    <!-- Colorful Saddle on Hump -->
    <rect x="98" y="125" width="24" height="15" rx="3" fill="#ef4444"/>
    <line x1="98" y1="132" x2="122" y2="132" stroke="#facc15" stroke-width="2"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>