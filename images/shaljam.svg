<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#fef08a"/><stop offset="100%" stop-color="#fed7aa"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="turnipG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9333ea"/><stop offset="40%" stop-color="#c084fc"/><stop offset="70%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Lush Green Leaves on Top -->
    <path d="M110 95 C90 55 65 65 60 85 C85 95 105 92 110 95 Z" fill="#16a34a"/>
    <path d="M110 95 C130 55 155 65 160 85 C135 95 115 92 110 95 Z" fill="#22c55e"/>
    <path d="M110 95 C110 40 100 45 110 45 C120 45 110 40 110 95 Z" fill="#4ade80"/>
    <!-- Turnip Body (Rosy Purple Top shading into Milky White Bottom) -->
    <ellipse cx="110" cy="150" rx="48" ry="44" fill="url(#turnipG)"/>
    <!-- Slender Root Tip at Bottom -->
    <path d="M110 194 Q112 210 118 214" stroke="#e2e8f0" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Specular Highlight -->
    <ellipse cx="88" cy="130" rx="10" ry="16" fill="#ffffff" opacity="0.4" transform="rotate(-25 88 130)"/>
    <!-- Cute Smiling Face on Turnip -->
    <circle cx="96" cy="155" r="4" fill="#1e293b"/>
    <circle cx="94.5" cy="153.5" r="1.5" fill="#ffffff"/>
    <circle cx="124" cy="155" r="4" fill="#1e293b"/>
    <circle cx="122.5" cy="153.5" r="1.5" fill="#ffffff"/>
    <!-- Cheeks & Happy Mouth -->
    <ellipse cx="90" cy="162" rx="4" ry="2" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="130" cy="162" rx="4" ry="2" fill="#f43f5e" opacity="0.4"/>
    <path d="M105 166 Q110 172 115 166" stroke="#831843" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>