<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Water Pond Ripples -->
    <ellipse cx="110" cy="216" rx="65" ry="14" fill="#38bdf8" opacity="0.6"/>
    <ellipse cx="110" cy="216" rx="42" ry="8" fill="#ffffff" opacity="0.4"/>
    <!-- Pink Lotus Flower Floating -->
    <ellipse cx="60" cy="212" rx="18" ry="6" fill="#15803d"/>
    <path d="M52 205 C50 195 60 190 60 190 C60 190 70 195 68 205 Z" fill="#f472b6"/>
    <circle cx="60" cy="202" r="3" fill="#facc15"/>
    <!-- Crane Long Slender Legs -->
    <line x1="102" y1="155" x2="102" y2="216" stroke="#f97316" stroke-width="4"/>
    <line x1="118" y1="155" x2="128" y2="216" stroke="#f97316" stroke-width="4"/>
    <!-- Crane White Plump Body -->
    <ellipse cx="110" cy="135" rx="34" ry="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Graceful Curved Neck -->
    <path d="M128 135 C150 115 135 85 145 65" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M128 135 C150 115 135 85 145 65" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <!-- Crane Head & Eye -->
    <circle cx="146" cy="65" r="10" fill="#ffffff"/>
    <circle cx="148" cy="63" r="2.5" fill="#1e293b"/>
    <!-- Long Sharp Yellow/Orange Beak -->
    <polygon points="154,62 188,68 154,72" fill="#f97316"/>
    <!-- Wing Feathers -->
    <path d="M85 135 C95 120 118 120 128 135 C115 152 95 152 85 135 Z" fill="#f1f5f9"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>