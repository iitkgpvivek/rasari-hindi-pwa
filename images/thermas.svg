<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#cffafe"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="thermasG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#06b6d4"/><stop offset="70%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#082f49" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Thermas Body (Aqua & Orange Insulated Flask) -->
    <rect x="78" y="85" width="64" height="120" rx="16" fill="url(#thermasG)"/>
    <!-- Decorative Stripes -->
    <rect x="78" y="125" width="64" height="12" fill="#fb923c"/>
    <rect x="78" y="145" width="64" height="6" fill="#fde047"/>
    <!-- Sturdy Carry Handle -->
    <path d="M78 105 C55 105 55 165 78 165" stroke="#0284c7" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Chrome Neck & Cup Cap -->
    <rect x="88" y="65" width="44" height="22" rx="6" fill="#f97316"/>
    <rect x="94" y="50" width="32" height="18" rx="5" fill="#0284c7"/>
    <!-- Little Steaming Cup on Side -->
    <path d="M145 175 L175 175 L170 205 L150 205 Z" fill="#f97316"/>
    <ellipse cx="160" cy="175" rx="15" ry="4" fill="#fed7aa"/>
    <!-- Cup Handle -->
    <path d="M172 182 C182 182 182 195 170 198" stroke="#f97316" stroke-width="3" fill="none"/>
    <!-- Steam Swirls from Cup -->
    <path d="M156 168 Q152 155 160 148" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M165 165 Q168 152 163 145" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>