<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="60%" stop-color="#e0f2fe"/><stop offset="100%" stop-color="#fef9c3"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
    <radialGradient id="pigeonGrad" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="55%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></radialGradient>
    <radialGradient id="neckGlow" cx="40%" cy="30%" r="70%"><stop offset="0%" stop-color="#86efac"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#64748b"/></radialGradient>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#86efac" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="214" rx="46" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Body -->
    <ellipse cx="115" cy="155" rx="42" ry="32" fill="url(#pigeonGrad)"/>
    <!-- Tail Feathers -->
    <polygon points="152,145 185,160 178,175 148,162" fill="#475569"/>
    <!-- Wing -->
    <path d="M90 148 C90 130 115 130 135 145 C125 175 100 175 90 148 Z" fill="#64748b"/>
    <path d="M98 152 Q120 142 130 156" stroke="#1e293b" stroke-width="2" fill="none"/>
    <!-- Neck with Iridescent Green/Purple Sheen -->
    <ellipse cx="88" cy="122" rx="22" ry="26" fill="url(#neckGlow)"/>
    <!-- Head -->
    <circle cx="78" cy="106" r="18" fill="url(#pigeonGrad)"/>
    <!-- Orange Beak -->
    <polygon points="60,105 46,108 60,111" fill="#f97316"/>
    <!-- Bright Pixar Eye -->
    <circle cx="72" cy="102" r="6" fill="#f97316"/>
    <circle cx="72" cy="102" r="3.8" fill="#1e293b"/>
    <circle cx="70.5" cy="100.5" r="1.5" fill="#ffffff"/>
    <!-- Little Pink Feet -->
    <line x1="102" y1="185" x2="100" y2="208" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    <line x1="122" y1="185" x2="124" y2="208" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>