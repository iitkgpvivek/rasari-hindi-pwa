<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fdba74"/><stop offset="50%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#fde047"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="fireOuterG" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="50%" stop-color="#ea580c"/><stop offset="100%" stop-color="#facc15"/></linearGradient>
       <linearGradient id="fireMidG" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#ea580c"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#ea580c" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="65" ry="14" fill="#451a03" opacity="0.35" filter="url(#ambOcc)"/>
    <!-- Sacred Stepped Brick Kund (Hawan Altar) -->
    <!-- Tier 1 Base -->
    <polygon points="36,210 184,210 172,190 48,190" fill="#7c2d12"/>
    <rect x="36" y="206" width="148" height="5" fill="#431407"/>
    <!-- Tier 2 Middle -->
    <polygon points="52,190 168,190 158,172 62,172" fill="#c2410c"/>
    <rect x="52" y="186" width="116" height="4" fill="#7c2d12"/>
    <!-- Tier 3 Top Lip -->
    <polygon points="66,172 154,172 144,155 76,155" fill="#ea580c"/>
    <rect x="66" y="168" width="88" height="4" fill="#9a3412"/>
    <!-- Crossed Sacred Sandalwood Logs in Kund -->
    <g transform="rotate(-15 110 150)">
      <rect x="75" y="146" width="70" height="12" rx="4" fill="#78350f"/>
    </g>
    <g transform="rotate(15 110 150)">
      <rect x="75" y="146" width="70" height="12" rx="4" fill="#92400e"/>
    </g>
    <!-- Sacred Agni Leaping Flames (Layered 3D Glow) -->
    <!-- Outer Crimson Flame -->
    <path d="M110 55 C125 80 155 100 150 135 C146 160 128 165 110 165 C92 165 74 160 70 135 C65 100 95 80 110 55 Z" fill="url(#fireOuterG)"/>
    <!-- Middle Bright Orange Flame -->
    <path d="M110 70 C120 90 142 108 138 135 C135 155 122 160 110 160 C98 160 85 155 82 135 C78 108 100 90 110 70 Z" fill="url(#fireMidG)"/>
    <!-- Inner Radiant Golden Core Flame -->
    <path d="M110 92 C116 105 128 118 126 138 C124 150 116 155 110 155 C104 155 96 150 94 138 C92 118 104 105 110 92 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Sacred Offering Droplets (Ghee) -->
    <circle cx="110" cy="115" r="3" fill="#fde047"/>
    <!-- Sacred Smoke Swirls ascending -->
    <path d="M96 55 Q90 35 102 20" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M124 50 Q130 30 118 15" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>