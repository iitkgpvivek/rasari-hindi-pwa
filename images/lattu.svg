<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#cffafe"/><stop offset="50%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#38bdf8" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow & Speed Swirls on Cobblestone -->
    <ellipse cx="110" cy="216" rx="42" ry="10" fill="#082f49" opacity="0.3" filter="url(#ambOcc)"/>
    <ellipse cx="110" cy="215" rx="55" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 6"/>
    <!-- Whirling Speed Rings in Air -->
    <ellipse cx="110" cy="120" rx="60" ry="12" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8" opacity="0.8"/>
    <!-- Spinning Top Body (Lattu) -->
    <!-- Top Crown Peg -->
    <rect x="105" y="60" width="10" height="22" rx="3" fill="#78350f"/>
    <ellipse cx="110" cy="60" rx="8" ry="4" fill="#a16207"/>
    <!-- Upper Dome (Vibrant Red) -->
    <path d="M52 118 C52 82 168 82 168 118 Z" fill="#ef4444"/>
    <!-- Yellow Waist Band with String Ribs -->
    <rect x="54" y="118" width="112" height="18" fill="#facc15"/>
    <line x1="54" y1="124" x2="166" y2="124" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="54" y1="130" x2="166" y2="130" stroke="#ffffff" stroke-width="1.8"/>
    <!-- Inverted Conical Base (Royal Blue) -->
    <polygon points="56,136 164,136 110,202" fill="#3b82f6"/>
    <!-- Metal Spinning Tip Pin -->
    <polygon points="107,202 113,202 110,214" fill="#94a3b8"/>
    <!-- Specular Highlight of Spinning -->
    <ellipse cx="88" cy="104" rx="10" ry="6" fill="#ffffff" opacity="0.6" transform="rotate(-20 88 104)"/>
    <!-- Sparkles -->
    <polygon points="165,110 167,114 172,116 167,118 165,123 163,118 158,116 163,114" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>