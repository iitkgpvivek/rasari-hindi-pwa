<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fed7aa"/><stop offset="50%" stop-color="#ffedd5"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <radialGradient id="copperG" cx="40%" cy="35%" r="65%"><stop offset="0%" stop-color="#ffedd5"/><stop offset="35%" stop-color="#fb923c"/><stop offset="75%" stop-color="#ea580c"/><stop offset="100%" stop-color="#9a3412"/></radialGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#ea580c" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#7c2d12" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Anvil / Wooden Block -->
    <rect x="70" y="165" width="80" height="45" rx="6" fill="#78350f"/>
    <!-- Gleaming Copper Vessel (Gagara / Kalash) -->
    <ellipse cx="110" cy="155" rx="36" ry="26" fill="url(#copperG)"/>
    <ellipse cx="110" cy="132" rx="20" ry="7" fill="#b45309"/>
    <path d="M90 132 C90 120 130 120 130 132 Z" fill="#f97316"/>
    <!-- Hammered Dimples on Copper Surface -->
    <circle cx="95" cy="150" r="3" fill="#ea580c" opacity="0.7"/>
    <circle cx="108" cy="155" r="3" fill="#ea580c" opacity="0.7"/>
    <circle cx="122" cy="150" r="3" fill="#ea580c" opacity="0.7"/>
    <circle cx="114" cy="165" r="3" fill="#ea580c" opacity="0.7"/>
    <!-- Specular Copper Sheen -->
    <ellipse cx="98" cy="145" rx="8" ry="14" fill="#ffffff" opacity="0.45" transform="rotate(-20 98 145)"/>
    <!-- Craftsman Hammer Raised -->
    <g transform="rotate(-25 140 100)">
      <rect x="135" y="60" width="8" height="60" rx="3" fill="#92400e"/>
      <rect x="124" y="52" width="30" height="16" rx="4" fill="#64748b"/>
    </g>
    <!-- Cheerful Sparkles of Polishing -->
    <polygon points="135,130 137,135 142,137 137,139 135,144 133,139 128,137 133,135" fill="#facc15"/>
    <polygon points="85,135 87,140 92,142 87,144 85,149 83,144 78,142 83,140" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>