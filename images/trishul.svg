<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="trishulGoldG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#facc15"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#15803d" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#064e3b" opacity="0.3" filter="url(#ambOcc)"/>
    <!-- Golden Trishul Shaft -->
    <line x1="110" y1="55" x2="110" y2="216" stroke="url(#trishulGoldG)" stroke-width="9" stroke-linecap="round"/>
    <line x1="110" y1="55" x2="110" y2="216" stroke="#fef08a" stroke-width="2.5" opacity="0.8"/>
    <!-- Ornate Crossbar & Damru Base -->
    <rect x="94" y="92" width="32" height="12" rx="4" fill="#ea580c"/>
    <circle cx="110" cy="98" r="4" fill="#facc15"/>
    <!-- Fluttering Red Scarf / Ribbon Tied on Shaft -->
    <path d="M110 104 Q85 110 70 125 Q85 130 110 112" fill="#dc2626"/>
    <!-- Center Trident Spearhead -->
    <polygon points="110,35 118,65 110,60 102,65" fill="url(#trishulGoldG)" stroke="#ca8a04" stroke-width="1.5"/>
    <!-- Left Crescent Prong -->
    <path d="M68 50 C68 95 110 95 110 95" stroke="url(#trishulGoldG)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <polygon points="68,45 74,62 64,62" fill="#facc15"/>
    <!-- Right Crescent Prong -->
    <path d="M152 50 C152 95 110 95 110 95" stroke="url(#trishulGoldG)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <polygon points="152,45 158,62 146,62" fill="#facc15"/>
    <!-- Divine Radiance Sparkles -->
    <polygon points="110,20 113,27 120,30 113,33 110,40 107,33 100,30 107,27" fill="#fef08a"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>