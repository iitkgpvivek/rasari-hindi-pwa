<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbcfe8"/><stop offset="50%" stop-color="#bae6fd"/><stop offset="100%" stop-color="#fef9c3"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
    <radialGradient id="wingGrad1" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#f472b6"/><stop offset="60%" stop-color="#ec4899"/><stop offset="100%" stop-color="#a855f7"/></radialGradient>
    <radialGradient id="wingGrad2" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="60%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#3b82f6"/></radialGradient>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#86efac" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <!-- Shadow -->
    <ellipse cx="110" cy="215" rx="45" ry="10" fill="#064e3b" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Back Wings Glow -->
    <path d="M110 135 C60 60 20 100 45 155 C65 190 105 160 110 135 Z" fill="url(#wingGrad1)"/>
    <path d="M110 135 C160 60 200 100 175 155 C155 190 115 160 110 135 Z" fill="url(#wingGrad1)"/>
    <!-- Lower Wings -->
    <path d="M110 145 C75 165 55 200 85 210 C105 210 110 170 110 145 Z" fill="url(#wingGrad2)"/>
    <path d="M110 145 C145 165 165 200 135 210 C115 210 110 170 110 145 Z" fill="url(#wingGrad2)"/>
    <!-- Wing Pattern Spots -->
    <circle cx="68" cy="120" r="9" fill="#fef08a"/>
    <circle cx="68" cy="120" r="4.5" fill="#f43f5e"/>
    <circle cx="152" cy="120" r="9" fill="#fef08a"/>
    <circle cx="152" cy="120" r="4.5" fill="#f43f5e"/>
    <!-- Body & Head -->
    <ellipse cx="110" cy="148" rx="7" ry="24" fill="#475569"/>
    <circle cx="110" cy="116" r="10" fill="#334155"/>
    <!-- Antennae with curly tips -->
    <path d="M106 110 Q92 88 84 94" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="84" cy="94" r="2.5" fill="#f43f5e"/>
    <path d="M114 110 Q128 88 136 94" stroke="#334155" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="136" cy="94" r="2.5" fill="#f43f5e"/>
    <!-- Face -->
    <circle cx="106" cy="115" r="2" fill="#ffffff"/>
    <circle cx="114" cy="115" r="2" fill="#ffffff"/>
    <path d="M108 120 Q110 123 112 120" stroke="#fbcfe8" stroke-width="1.5" fill="none"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>