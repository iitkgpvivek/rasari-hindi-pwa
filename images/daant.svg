<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bae6fd"/><stop offset="50%" stop-color="#cffafe"/><stop offset="100%" stop-color="#fef08a"/></linearGradient>
    <linearGradient id="gHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="25%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fef08a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="ambOcc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    
  </defs>

  <!-- Full-bleed Sky Scenery -->
  <rect width="220" height="260" fill="url(#bgSky)"/>
  <rect width="220" height="260" fill="url(#sunGlow)"/>

  <!-- Distant Hill -->
  <path d="M-20 185 Q40 162 110 174 Q180 188 240 170 L240 260 L-20 260 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Foreground Hill Plate -->
  <path d="M-20 196 Q60 178 140 186 Q190 192 240 182 L240 260 L-20 260 Z" fill="url(#gHill)"/>

  <!-- Nature Daisies -->
  <circle cx="28" cy="226" r="3.5" fill="#ffffff"/>
  <circle cx="28" cy="226" r="1.5" fill="#facc15"/>
  <circle cx="192" cy="216" r="4" fill="#ffffff"/>
  <circle cx="192" cy="216" r="1.8" fill="#facc15"/>
  <circle cx="176" cy="236" r="3" fill="#ffffff"/>
  <circle cx="176" cy="236" r="1.4" fill="#facc15"/>

  <!-- Main 3D Subject -->
  <g filter="url(#cardShadow)">
    
    <ellipse cx="110" cy="216" rx="55" ry="12" fill="#082f49" opacity="0.25" filter="url(#ambOcc)"/>
    <!-- Toothbrush in Hand -->
    <rect x="52" y="125" width="12" height="75" rx="4" fill="#3b82f6" transform="rotate(-25 58 160)"/>
    <rect x="58" y="112" width="18" height="15" rx="3" fill="#ffffff" transform="rotate(-25 58 160)"/>
    <!-- Big Smiling White Tooth Body -->
    <path d="M78 95 C62 125 72 175 88 205 C96 175 104 155 110 155 C116 155 124 175 132 205 C148 175 158 125 142 95 C128 85 118 95 110 95 C102 95 92 85 78 95 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Big Sparkling Eyes -->
    <circle cx="98" cy="120" r="4.5" fill="#1e293b"/>
    <circle cx="96.5" cy="118.5" r="1.8" fill="#ffffff"/>
    <circle cx="122" cy="120" r="4.5" fill="#1e293b"/>
    <circle cx="120.5" cy="118.5" r="1.8" fill="#ffffff"/>
    <!-- Big Happy Smile -->
    <path d="M104 132 Q110 140 116 132" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <ellipse cx="92" cy="128" rx="3.5" ry="2" fill="#f43f5e" opacity="0.4"/>
    <ellipse cx="128" cy="128" rx="3.5" ry="2" fill="#f43f5e" opacity="0.4"/>
    <!-- Sparkles of Cleanliness -->
    <polygon points="145,88 147,93 152,95 147,97 145,102 143,97 138,95 143,93" fill="#facc15"/>
    <polygon points="72,105 74,109 78,110 74,111 72,115 70,111 66,110 70,109" fill="#facc15"/>
    
  </g>

  <!-- Sparkles -->
  <path d="M38 78 L41 68 L44 78 L54 81 L44 84 L41 94 L38 84 L28 81 Z" fill="#fef08a" opacity="0.8"/>
  <circle cx="185" cy="105" r="2" fill="#ffffff" opacity="0.85"/>
</svg>